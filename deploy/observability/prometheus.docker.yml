# Prometheus 抓取配置 —— 容器全栈版（deploy/docker-compose.yml）。
# 与 prometheus.yml 的差别仅在抓取目标：容器网络 DNS 名，而非宿主机映射端口。
# OpenMetrics 协议优先协商（exemplar 仅 OpenMetrics 格式可传）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nimbus-apiserver
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    static_configs:
      - targets: ["apiserver:8080"]
        labels:
          service: api

  - job_name: nimbus-transferserver
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    static_configs:
      - targets: ["transferserver:8081"]
        labels:
          service: transfer
