# Prometheus 抓取配置。
# 抓取宿主机上的 NimbusDrive 双服务 /metrics 端点。
# OpenMetrics 协议优先协商（exemplar 仅 OpenMetrics 格式可传）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nimbus-apiserver
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: api

  - job_name: nimbus-transferserver
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: transfer
