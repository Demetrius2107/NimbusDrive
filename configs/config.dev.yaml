# NimbusDrive 开发环境配置
# 生产环境用 config.prod.yaml，敏感字段用环境变量覆盖（NIMBUS_ 前缀）。

app:
  name: NimbusDrive
  env: dev
  log_level: debug
  log_dir: ./logs
  storage_mode: minio

api_server:
  host: 0.0.0.0
  port: 8080
  read_timeout_sec: 30
  write_timeout_sec: 30

transfer_server:
  host: 0.0.0.0
  port: 8081
  read_timeout_sec: 300
  write_timeout_sec: 300

postgres:
  host: 127.0.0.1
  port: 5432
  user: nimbus
  password: nimbus
  database: nimbusdrive
  ssl_mode: disable
  max_open_conns: 50
  max_idle_conns: 10

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

minio:
  endpoint: 127.0.0.1:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: nimbus-drive
  use_ssl: false
  region: us-east-1
  presign_expire_sec: 3600
  # 公网端点：客户端直连 MinIO 拉预签名 URL 用。dev 留空回退到 endpoint。
  public_endpoint: ""
  public_use_ssl: false
  # 分享下载能力令牌 TTL（秒），单次消费。
  share_download_token_ttl_sec: 300

jwt:
  secret: change-me-in-prod
  access_exp_min: 120
  refresh_exp_day: 30
  issuer: nimbusdrive

event_bus:
  stream_prefix: "nimbus:events:"
  consumer_group: "nimbus-workers"
  buffer_size: 1024
  max_retries: 3
  block_ms: 2000
  dlq_prefix: "nimbus:dlq:"
  stream_max_len: 10000

# 分布式追踪（OpenTelemetry）。stdout=写 stderr（开发期零依赖）；otlp=推本地 collector。
# 切 OTLP 时改 exporter: otlp 并起 Jaeger/Tempo，不改代码。
observability:
  exporter: stdout
  otlp_endpoint: localhost:4317
  service_name: ""
  sample_ratio: 1.0
  # Prometheus 指标 + /metrics 端点。抓取端走 Grafana 栈（见 deploy/observability/）。
  metrics_enabled: true
  metrics_path: /metrics

# 后台清理/relay 定时任务（全部跑在 APIServer 控制面）。
# 每个任务独立 interval + batch_size，避免单事务扫全表持锁过久。
cron:
  # 回收站 30 天物理清理：deleted_at < now()-retention 的节点物理删除 + ref_count-- + 配额回补。
  trash_purge:
    interval_sec: 21600   # 6h
    retention_days: 30
    batch_size: 100
  # 零引用哈希 GC：ref_count=0 且 zero_ref_at < now()-grace 的物理对象回收。
  # grace 窗口防并发 re-reference 误删（tombstone + grace 的竞态防护）。
  hash_gc:
    interval_sec: 21600   # 6h
    grace_hours: 24
    batch_size: 50
  # 上传会话过期清理：active 且 expires_at < now 的会话标 expired + 清理 init 占位文件 + AbortMultipart。
  session_expiry:
    interval_sec: 3600    # 1h
    batch_size: 200
  # outbox relay：published_at IS NULL 的事件 XAdd 后回写。高频小批，保证事件最终投递。
  outbox:
    interval_sec: 2
    batch_size: 100
