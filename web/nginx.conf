# NimbusDrive 前端站点 + API 反向代理（与 vite dev proxy 路由规则对齐）。
# upstream 用容器网络 DNS 名，由 docker-compose 网络解析。

upstream nimbus_api {
    server apiserver:8080;
}

upstream nimbus_transfer {
    server transferserver:8081;
}

server {
    listen 80;
    server_name _;

    # 上传分块 4MB，留余量；下载/上传都是长请求，body 限制只影响请求体
    client_max_body_size 32m;

    # 静态资源：带 hash 的 assets 长缓存，index.html 不缓存（保证发版即生效）
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SSE：配额实时推送。必须关缓冲，否则事件被 nginx 攒批不下发。
    location /api/v1/quota/stream {
        proxy_pass http://nimbus_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # 分块上传 / 流式下载 → TransferServer
    location /api/v1/upload {
        proxy_pass http://nimbus_transfer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/v1/download {
        proxy_pass http://nimbus_transfer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 其余 API（含 /api/v1/s/* 公开分享页接口）→ APIServer
    location /api/ {
        proxy_pass http://nimbus_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # WebDAV 可写挂载（PUT/PROPFIND/MOVE 长请求）→ TransferServer。
    # 关请求缓冲：大文件 PUT 不落 nginx 磁盘/内存，边收边转发。
    location /dav/ {
        proxy_pass http://nimbus_transfer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        client_max_body_size 4g;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 分享下载兑换（能力令牌单次消费）在 TransferServer，优先于上面的 /api/ 前缀匹配
    location /api/v1/s/download/ {
        proxy_pass http://nimbus_transfer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # SPA history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
